[package]
name = "lighttranslator"
version = "1.6.0"
description = "A lightweight translation app"
authors = ["LightTranslator"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.5", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
# Second instance forwards `--quick-translate` to the running app: that is
# how the GNOME custom shortcut reaches us under Wayland.
tauri-plugin-single-instance = "2"
# PRIMARY selection reads (the clipboard plugin only exposes CLIPBOARD)
arboard = "3"
# GSettings for the GNOME custom shortcut entry; already in the tree via gtk
gio = "0.18"
reqwest = { version = "0.12", features = ["json", "socks"] }
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
